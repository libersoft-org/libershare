<!doctype html>
<html lang="en">
	<meta charset="utf-8" />
	<link rel="icon" href="data:," />
	<title>LISH file info browser regressions</title>
	<!-- As on the app's content scroller: no scroll anchoring, so a row growing above the view pushes the rest down. -->
	<style>
		html {
			overflow-anchor: none;
		}
	</style>
	<pre id="results">Running...</pre>
	<div id="page"></div>
	<script type="module">
		import { mount, unmount, tick } from 'svelte';
		import { get } from 'svelte/store';
		import StorageLISHInfo from '/src/pages/Storage/StorageLISHInfo.svelte';
		import Storage from '/src/pages/Storage/Storage.svelte';
		import NetworkPeersPeerDetailLish from '/src/pages/Network/NetworkPeersPeerDetailLish.svelte';
		import NetworkLishsPeerList from '/src/pages/Network/NetworkLishsPeerList.svelte';
		import { api } from '/src/scripts/api.ts';
		import { translations, t, translateError } from '/src/scripts/language.ts';
		import { emit } from '/src/scripts/areas.ts';
		const root = document.querySelector('#page');
		const results = [];
		const originalInspect = api.lishs.inspectFile;
		let inspection;
		api.lishs.inspectFile = async () => {
			if (inspection instanceof Error) throw inspection;
			return structuredClone(inspection);
		};
		const detail = (id, name, totalChunks) => ({ id, name, created: '2026-01-01T00:00:00.000Z', chunkSize: 1024, checksumAlgo: 'sha256', totalSize: 2500, totalChunks, fileCount: 1, directoryCount: 0, files: [{ path: 'a.bin', size: 2500 }], directories: [], links: [] });
		const valid = { detail: detail('c0000000-0000-4000-8000-000000000001', 'First LISH', 3) };
		const second = { detail: detail('c0000000-0000-4000-8000-000000000002', 'Second LISH', 7) };
		const broken = { error: 'LISH_INVALID_MANIFEST', errorDetail: '"short.bin": expected 3 checksums for size 2500 / chunkSize 1024, got 2' };
		let component;
		let calls;
		async function settle() {
			for (let i = 0; i < 3; i++) {
				await tick();
				await new Promise(resolve => setTimeout(resolve, 0));
			}
		}
		function assert(value, message) {
			if (!value) throw new Error(message);
		}
		function button(label) {
			return [...root.querySelectorAll('.button')].find(item => item.textContent.trim() === label);
		}
		async function open(items, areaID) {
			if (component) await unmount(component);
			inspection = items;
			calls = { back: 0, import: 0 };
			component = mount(StorageLISHInfo, { target: root, props: { areaID, filePath: '/files/example.lishs', onBack: () => calls.back++, onImport: () => calls.import++ } });
			await settle();
		}
		async function test(name, action) {
			try {
				await action();
				results.push({ name, passed: true });
			} catch (error) {
				results.push({ name, passed: false, error: error.message });
			}
		}
		try {
			await new Promise(resolve => {
				const unsubscribe = translations.subscribe(value => {
					if (value.lish?.fileInfo)
						queueMicrotask(() => {
							unsubscribe();
							resolve();
						});
				});
			});
			const tr = get(t);
			await test('a valid .lish shows its summary with the chunk count and offers the import', async () => {
				await open([valid], 'lish-info-single');
				assert(root.textContent.includes('First LISH') && root.textContent.includes(valid.detail.id), 'Name or ID is missing');
				const labels = [...root.querySelectorAll('.info-section .label')];
				assert(labels[0]?.textContent.startsWith(tr('network.lishID')) && labels[1]?.textContent.startsWith(tr('common.name')), 'LISH ID is not the first row, followed by the name');
				// One grid for every row: all values start at the same horizontal position.
				const starts = new Set([...root.querySelectorAll('.info-section .value')].map(value => Math.round(value.getBoundingClientRect().left)));
				assert(starts.size === 1, `Values start at ${starts.size} different positions`);
				const chunks = [...root.querySelectorAll('.info-section .row')].find(row => row.textContent.includes(tr('downloads.chunks')));
				assert(chunks?.textContent.includes('3'), 'Chunk count row is missing or wrong');
				button(tr('common.import')).click();
				button(tr('common.back')).click();
				assert(calls.import === 1 && calls.back === 1, 'Import or Back did not reach the page owner');
			});
			await test('an invalid manifest shows the reason and no import', async () => {
				await open([broken], 'lish-info-broken');
				const alert = root.textContent;
				assert(alert.includes(tr('lish.errorInvalidManifest').replace('{detail}', broken.errorDetail)), 'Translated refusal with its detail is missing');
				assert(!button(tr('common.import')), 'Import is offered for a refused manifest');
			});
			await test('a .lishs lists its manifests and opens one from the keyboard', async () => {
				await open([valid, second, broken], 'lish-info-many');
				const rows = root.querySelectorAll('.row');
				assert(rows.length === 3, `Expected three rows, got ${rows.length}`);
				assert(rows[2].textContent.includes(tr('lish.fileInvalid')) && rows[0].textContent.includes(tr('lish.fileValid')), 'Row status is missing');
				// At any window width the visible cells of a row stay side by side, not stacked into one column.
				const tops = [...rows[0].querySelectorAll('.cell')].filter(cell => cell.offsetParent).map(cell => cell.getBoundingClientRect().top);
				assert(tops.length >= 4 && tops.every(top => Math.abs(top - tops[0]) < 5), `Row cells are stacked: ${tops.join(', ')}`);
				assert(!button(tr('common.import')), 'Import is offered for a file with a refused manifest');
				emit('down');
				emit('down');
				await settle();
				emit('confirmDown');
				emit('confirmUp');
				await settle();
				assert(root.textContent.includes('Second LISH') && root.textContent.includes(second.detail.id), 'Second manifest did not open');
				assert(!root.textContent.includes('First LISH'), 'The table is still shown under the detail');
				button(tr('common.back')).click();
				await settle();
				assert(root.querySelectorAll('.row').length === 3, 'Back did not return to the table');
				assert(calls.back === 0, 'Back from the item left the whole page');
			});
			await test('an entry shows its permissions, times and link type on request', async () => {
				const full = {
					detail: {
						...detail('c0000000-0000-4000-8000-000000000004', 'Full', 3),
						directoryCount: 1,
						files: [{ path: 'a.bin', size: 2500, permissions: '0640', created: '2020-01-02T03:04:05.000Z', modified: '2021-06-07T08:09:10.000Z' }],
						directories: [{ path: 'docs', permissions: '0750' }],
						links: [
							{ path: 'hard', target: 'a.bin', hardlink: true },
							{ path: 'soft', target: 'a.bin' },
						],
					},
				};
				await open([full], 'lish-info-details');
				// No empty details box either: as a grid item it would add a row gap to every collapsed row.
				assert(!root.querySelector('.details'), 'Details are shown before they are asked for');
				const rowNamed = name => [...root.querySelectorAll('.row')].find(row => row.textContent.trim().startsWith(name));
				const confirmRow = async name => {
					while (root.querySelector('.row.selected') !== rowNamed(name)) {
						emit('down');
						await settle();
					}
					emit('confirmDown');
					emit('confirmUp');
					await settle();
				};
				await confirmRow('docs');
				let shown = root.querySelector('.entry-details')?.textContent ?? '';
				assert(shown.includes(tr('lish.entryDirectory')) && shown.includes('0750'), `Directory details are wrong: ${shown}`);
				await confirmRow('a.bin');
				shown = root.querySelector('.entry-details')?.textContent ?? '';
				assert(shown.includes('0640') && shown.includes(new Date('2020-01-02T03:04:05.000Z').toLocaleString()) && shown.includes(new Date('2021-06-07T08:09:10.000Z').toLocaleString()), `File permissions or times are missing: ${shown}`);
				await confirmRow('hard');
				shown = root.querySelector('.entry-details')?.textContent ?? '';
				assert(shown.includes(tr('lish.entryHardLink')), `Hard link details are wrong: ${shown}`);
				await confirmRow('soft');
				shown = root.querySelector('.entry-details')?.textContent ?? '';
				assert(shown.includes(tr('lish.entrySymbolicLink')) && shown.includes('a.bin'), `Symbolic link details are wrong: ${shown}`);
				emit('confirmDown');
				emit('confirmUp');
				await settle();
				assert(!root.querySelector('.entry-details'), 'A second confirm does not hide the details');
			});
			await test('invalid metadata shows a marker instead of breaking the details', async () => {
				// `created` as the file wrote it (a summary from an older node passes it on unchecked), `modified` as the backend flags it.
				const odd = { detail: { ...detail('c0000000-0000-4000-8000-000000000006', 'Odd', 3), created: 'not a date', files: [{ path: 'a.bin', size: 2500, created: { toString: 0, valueOf: 0 }, permissions: '0640', invalidFields: ['modified'] }] } };
				await open([odd], 'lish-info-odd');
				const marker = tr('lish.entryInvalidValue');
				emit('down');
				await settle();
				emit('confirmDown');
				emit('confirmUp');
				await settle();
				const shown = root.querySelector('.entry-details')?.textContent ?? '';
				assert(shown.includes('0640'), `The details did not render: ${shown}`);
				const marked = [...root.querySelectorAll('.entry-details .invalid')].map(value => value.parentElement.textContent);
				assert(marked.length === 2 && marked.some(row => row.includes(tr('network.created')) && row.includes(marker)) && marked.some(row => row.includes(tr('localStorage.modified')) && row.includes(marker)), `Invalid fields are not marked: ${JSON.stringify(marked)}`);
				const created = [...root.querySelectorAll('.info-section .row')].find(row => row.textContent.includes(tr('network.created')));
				assert(created?.querySelector('.invalid')?.textContent === marker, `An unreadable LISH date is not marked: ${created?.textContent}`);
			});
			await test('in a narrow window neither info page scrolls sideways', async () => {
				assert(innerWidth < 1199, `The window is ${innerWidth} px wide, too wide for the narrow layout`);
				await open([valid], 'lish-info-narrow');
				const page = root.querySelector('.lish-info');
				assert(page.scrollWidth === page.clientWidth, `The info page overflows: ${page.scrollWidth} > ${page.clientWidth}`);
				await open([valid, second], 'lish-info-narrow-item');
				emit('down');
				await settle();
				emit('confirmDown');
				emit('confirmUp');
				await settle();
				const item = root.querySelector('.lish-info-item');
				assert(item, 'The item did not open');
				assert(item.scrollWidth === item.clientWidth, `The item page overflows: ${item.scrollWidth} > ${item.clientWidth}`);
			});
			await test('Back from a .lishs item selects the row it was opened from', async () => {
				await open([valid, second, broken], 'lish-info-back-row');
				const selectedRow = () => [...root.querySelectorAll('.row')].findIndex(row => row.classList.contains('selected'));
				for (const leave of [() => button(tr('common.back')).click(), () => emit('back')]) {
					emit('down');
					emit('down');
					await settle();
					assert(selectedRow() === 1, `The second row is not selected: ${selectedRow()}`);
					emit('confirmDown');
					emit('confirmUp');
					await settle();
					assert(root.textContent.includes(second.detail.id), 'The second manifest did not open');
					leave();
					await settle();
					assert(root.querySelectorAll('.row').length === 3, 'Back did not return to the table');
					assert(selectedRow() === 1, `Back selected row ${selectedRow()} instead of the second one`);
					emit('up');
					emit('up');
					await settle();
				}
			});
			await test('the file list of a .lishs item pages with PageDown and End', async () => {
				const files = Array.from({ length: 25 }, (_, i) => ({ path: `f${String(i + 1).padStart(2, '0')}.bin`, size: 10 }));
				const many = { detail: { ...detail('c0000000-0000-4000-8000-000000000003', 'Many files', 25), totalSize: 250, fileCount: 25, files } };
				await open([many, broken], 'lish-info-paging');
				emit('down');
				await settle();
				emit('confirmDown');
				emit('confirmUp');
				await settle();
				assert(root.textContent.includes('Many files'), 'The item did not open');
				const selectedName = () => root.querySelector('.row.selected')?.textContent.trim().split(/\s/)[0];
				emit('down');
				await settle();
				assert(selectedName() === 'f01.bin', `Down did not reach the first file: ${selectedName()}`);
				emit('pageDown');
				await settle();
				assert(selectedName() !== 'f01.bin' && selectedName()?.startsWith('f'), `PageDown did not move through the files: ${selectedName()}`);
				emit('end');
				await settle();
				assert(selectedName() === 'f25.bin', `End did not reach the last file: ${selectedName()}`);
				emit('home');
				await settle();
				assert(selectedName() === 'f01.bin', `Home did not return to the first file: ${selectedName()}`);
			});
			await test('Back from a Linux file with a backslash in its name reopens its folder', async () => {
				if (component) await unmount(component);
				component = undefined;
				inspection = [valid];
				const listed = [];
				const fs = { info: api.fs.info, list: api.fs.list };
				api.fs.info = async () => ({ platform: 'linux', separator: '/', home: '/home/user', roots: ['/'], localFilesystem: true });
				api.fs.list = async path => {
					listed.push(path);
					return { path, entries: [{ name: 'a\\b.lish', path: path + '/a\\b.lish', type: 'file', size: 10 }] };
				};
				const storage = mount(Storage, { target: root, props: { areaID: 'lish-info-storage', initialPath: '/x', initialFile: 'a\\b.lish' } });
				try {
					await settle();
					assert(listed.at(-1) === '/x', `The browser did not open /x: ${listed.at(-1)}`);
					for (let i = 0; i < 2 && !root.textContent.includes('First LISH'); i++) {
						emit('confirmDown');
						emit('confirmUp');
						await settle();
					}
					assert(root.textContent.includes('First LISH'), 'The file did not open on its info page');
					button(tr('common.back')).click();
					await settle();
					assert(listed.at(-1) === '/x', `Back reopened ${listed.at(-1)} instead of /x`);
				} finally {
					await unmount(storage);
					Object.assign(api.fs, fs);
				}
			});
			// The same manifest summary a peer sends, so the peer pages show what the storage page shows.
			const peerDetail = { ...detail('c0000000-0000-4000-8000-000000000009', 'From a peer', 3), files: [{ path: 'a.bin', size: 2500, permissions: '0640' }] };
			await test('the peer LISH detail opens an entry by keyboard, like the storage page', async () => {
				if (component) await unmount(component);
				component = undefined;
				const original = api.lishnets.getPeerLish;
				api.lishnets.getPeerLish = async () => structuredClone(peerDetail);
				const page = mount(NetworkPeersPeerDetailLish, { target: root, props: { areaID: 'lish-info-peer', lish: { id: peerDetail.id, name: peerDetail.name }, peerID: 'peer-1', networkID: 'net-1', onBack: () => {} } });
				try {
					await settle();
					assert(root.textContent.includes(tr('lish.entryDetailsHint')), 'The hint is missing');
					while (!root.querySelector('.row.selected')?.textContent.includes('a.bin')) {
						emit('down');
						await settle();
						assert(root.querySelector('.row.selected'), 'Down did not reach the file row');
					}
					emit('confirmDown');
					emit('confirmUp');
					await settle();
					const shown = root.querySelector('.entry-details')?.textContent ?? '';
					assert(shown.includes(tr('lish.entryFile')) && shown.includes('0640'), `Entry details are missing: ${shown}`);
				} finally {
					await unmount(page);
					api.lishnets.getPeerLish = original;
				}
			});
			await test('the search peer list opens an entry of the loaded detail by click', async () => {
				if (component) await unmount(component);
				component = undefined;
				const original = api.lishnets.getPeerLish;
				api.lishnets.getPeerLish = async () => structuredClone(peerDetail);
				const row = { id: peerDetail.id, name: peerDetail.name, peers: [{ peerID: 'peer-1', networkID: 'net-1' }] };
				const page = mount(NetworkLishsPeerList, { target: root, props: { areaID: 'lish-info-search', row, networks: [], onBack: () => {}, onOpenPeer: () => {} } });
				try {
					await settle();
					button(tr('network.details')).click();
					await settle();
					assert(root.textContent.includes(tr('lish.entryDetailsHint')), 'The hint is missing');
					const file = [...root.querySelectorAll('.row')].find(item => item.textContent.trim().startsWith('a.bin'));
					assert(file, 'The file row is missing');
					file.click();
					await settle();
					const shown = root.querySelector('.entry-details')?.textContent ?? '';
					assert(shown.includes(tr('lish.entryFile')) && shown.includes('0640'), `Entry details are missing: ${shown}`);
				} finally {
					await unmount(page);
					api.lishnets.getPeerLish = original;
				}
			});
			await test('an empty .lishs says so and offers no import', async () => {
				await open([], 'lish-info-empty');
				assert(root.textContent.includes(tr('lish.fileEmpty')), 'Empty-file message is missing');
				assert(!button(tr('common.import')), 'Import is offered for an empty file');
			});
			await test('an unreadable file shows the error and no import', async () => {
				const failure = Object.assign(new Error('INVALID_JSON'), { code: 'INVALID_JSON', detail: '/files/example.lishs: bad' });
				await open(failure, 'lish-info-unreadable');
				assert(root.textContent.includes(translateError(failure)), 'Error is not shown');
				assert(!button(tr('common.import')), 'Import is offered for an unreadable file');
			});
		} catch (error) {
			results.push({ name: 'fixture setup', passed: false, error: error.message });
		} finally {
			if (component) await unmount(component);
			api.lishs.inspectFile = originalInspect;
			document.querySelector('#results').textContent = JSON.stringify(results, null, 2);
			window.lishFileInfoTestResults = results;
			document.documentElement.dataset.testStatus = results.length === 13 && results.every(result => result.passed) ? 'passed' : 'failed';
		}
	</script>
</html>
