<!doctype html>
<html lang="en">
	<meta charset="utf-8" />
	<title>Network form browser regressions</title>
	<p>Run <code>bun run vite --config tests/browser/vite.config.ts</code> from frontend, then open /tests/browser/network-form.html. This mounts real Svelte components with controlled API and gamepad test doubles; no native network operations run.</p>
	<pre id="results">Running...</pre>
	<div id="form"></div>
	<script type="module">
		import '/src/app.css';
		import { mount, unmount, tick } from 'svelte';
		import { get } from 'svelte/store';
		import SettingsNetworkEdit from '/src/pages/Settings/SettingsNetworkEdit.svelte';
		import { api } from '/src/scripts/api.ts';
		import { networkState, networkSubscriptionActive } from '/src/scripts/networkState.ts';
		import { translations, t } from '/src/scripts/language.ts';
		import { emit } from '/src/scripts/areas.ts';
		import { startInput, stopInput } from '/src/scripts/input/input.ts';

		const target = document.querySelector('#form');
		const output = document.querySelector('#results');
		const results = [];
		const originalCall = api.call;
		let component;
		let host;
		let joinFails = false;
		let waitForJoin = false;
		let waitForDisconnect = false;
		let pendingJoin;
		let pendingDisconnect;
		let disconnectCalls = 0;
		let scanFails = false;
		let applyCalls = 0;
		let joinCalls = [];
		const testNetwork = { ssid: 'Test network', bssid: null, security: 'WPA2', secured: true, supported: true, active: false, signal: 80 };
		let wifi = [testNetwork];

		function initialHost() {
			return {
				known: true,
				detail: 'full',
				primaryID: 'wifi0',
				capabilities: { ipv4: true, wifi: true, staticGatewayRequired: false },
				interfaces: [
					{
						id: 'wifi0',
						name: 'Test adapter',
						medium: 'wireless',
						link: 'up',
						defaultRoute: true,
						mac: null,
						addresses: [{ family: 'ipv4', address: '192.0.2.10', prefixLength: 24 }],
						ipv4Mode: 'static',
						ipv4Configurable: true,
						wifiConfigurable: true,
						gateway: '192.0.2.1',
						dns: ['192.0.2.53'],
					},
				],
			};
		}

		api.call = async (method, params) => {
			if (method === 'system.network') return structuredClone(host);
			if (method === 'system.wifiScan') {
				if (scanFails) throw new Error('Test scan failed');
				return structuredClone(wifi);
			}
			if (method === 'system.wifiConnect') {
				joinCalls.push(params);
				if (waitForJoin) await new Promise((resolve, reject) => { pendingJoin = { resolve, reject }; });
				if (joinFails) {
					host.interfaces[0].addresses = [];
					throw new Error('Test join rejected: check the password');
				}
				return structuredClone(host);
			}
			if (method === 'system.wifiDisconnect') {
				disconnectCalls++;
				if (waitForDisconnect) await new Promise((resolve, reject) => { pendingDisconnect = { resolve, reject }; });
				host.interfaces[0].wifi = { ssid: null, signal: null, radio: 'on' };
				host.interfaces[0].addresses = [];
				return structuredClone(host);
			}
			if (method === 'system.networkApply') {
				applyCalls++;
				const config = params.config;
				host.interfaces[0].addresses = [{ family: 'ipv4', address: config.address, prefixLength: config.prefixLength }];
				host.interfaces[0].gateway = config.gateway;
				return structuredClone(host);
			}
			throw new Error(`Unexpected API call: ${method}`);
		};

		async function settle() {
			await tick();
			await new Promise(resolve => setTimeout(resolve, 0));
			await tick();
		}

		function assert(condition, message) {
			if (!condition) throw new Error(message);
		}

		function button(label) {
			const found = [...target.querySelectorAll('[role="button"]')].find(item => (item.getAttribute('aria-label') ?? item.textContent.trim()) === label);
			assert(found, `Missing button: ${label}`);
			return found;
		}

		const label = key => get(t)(key);
		const message = () => target.querySelector('.message')?.textContent ?? '';
		const address = () => target.querySelector('input[type="text"]');
		const save = () => button(label('common.save'));

		async function click(buttonLabel) {
			button(buttonLabel).click();
			await settle();
		}

		async function edit(input, value) {
			input.value = value;
			input.dispatchEvent(new Event('input', { bubbles: true }));
			await settle();
		}

		async function publish(addressValue) {
			host.interfaces[0].addresses = addressValue ? [{ family: 'ipv4', address: addressValue, prefixLength: 24 }] : [];
			networkState.set(structuredClone(host));
			await settle();
		}

		async function reset() {
			if (component) await unmount(component);
			host = initialHost();
			joinFails = false;
			waitForJoin = false;
			waitForDisconnect = false;
			pendingJoin = undefined;
			pendingDisconnect = undefined;
			disconnectCalls = 0;
			scanFails = false;
			wifi = [testNetwork];
			applyCalls = 0;
			joinCalls = [];
			networkSubscriptionActive.set(true);
			networkState.set(structuredClone(host));
			component = mount(SettingsNetworkEdit, { target, props: { areaID: 'network-browser-test', interfaceID: 'wifi0' } });
			await settle();
			assert(address()?.value === '192.0.2.10', 'The real form was not seeded');
		}

		async function test(name, run) {
			try {
				await reset();
				await run();
				results.push({ name, passed: true });
			} catch (error) {
				results.push({ name, passed: false, error: error.message });
			}
			output.textContent = results.map(result => `${result.passed ? 'PASS' : 'FAIL'} ${result.name}${result.error ? `: ${result.error}` : ''}`).join('\n');
		}

		async function successfulSave() {
			await edit(address(), '192.0.2.20');
			await click(label('common.save'));
			assert(applyCalls === 1 && message() === label('settings.network.applied'), 'Save did not report success');
		}

		try {
			// Wait for the actual asynchronous language loader before matching labels.
			await new Promise(resolve => {
				const unsubscribe = translations.subscribe(value => {
					if (value.settings?.network && value.common)
						queueMicrotask(() => {
							unsubscribe();
							resolve();
						});
				});
			});

			await test('new IPv4 edit supersedes the previous save result', async () => {
				await successfulSave();
				await edit(address(), '192.0.2.30');
				await publish('192.0.2.40');
				assert(address().value === '192.0.2.30', 'External update overwrote typed address');
				assert(save().classList.contains('disabled'), 'Stale form allows Save');
				assert(message() === label('settings.network.changedOutside'), `Stale warning hidden by: ${message()}`);
			});

			await test('scan clears the previous result and permits a later host notice', async () => {
				await successfulSave();
				await click(label('settings.network.scan'));
				assert(message() === '', 'Scan did not clear the old result');
				await publish('192.0.2.40');
				assert(address().value === '192.0.2.40', 'Clean form did not adopt host state');
				assert(message() === label('settings.network.reloadedFromHost'), 'Host notice suppressed after scan');
			});

			await test('new DNS policy selection supersedes the previous save result', async () => {
				await successfulSave();
				const policy = target.querySelectorAll('select')[1];
				policy.value = 'automatic';
				policy.dispatchEvent(new Event('change', { bubbles: true }));
				await settle();
				await publish('192.0.2.40');
				assert(save().classList.contains('disabled'), 'Stale DNS policy allows Save');
				assert(message() === label('settings.network.changedOutside'), `Stale DNS policy warning hidden by: ${message()}`);
			});

			for (const failed of [false, true]) {
				await test(`${failed ? 'failed' : 'empty'} scan preserves the stale Save explanation`, async () => {
					await edit(address(), '192.0.2.30');
					await publish('192.0.2.40');
					wifi = [];
					scanFails = failed;
					await click(label('settings.network.scan'));
					assert(save().classList.contains('disabled'), 'Scan made stale Save available');
					assert(target.textContent.includes(label('settings.network.reloadRequired')), `Scan hid stale Save explanation behind: ${message()}`);
					assert(message() === (failed ? 'Test scan failed' : label('settings.network.noWifiFound')), 'Scan result missing');
				});
			}

			for (const failed of [false, true]) {
				for (const dirty of [false, true]) {
					await test(`${failed ? 'failed' : 'empty'} scan survives changed host updates with ${dirty ? 'dirty' : 'clean'} IPv4 form`, async () => {
						if (dirty) await edit(address(), '192.0.2.30');
						wifi = [];
						scanFails = failed;
						await click(label('settings.network.scan'));
						const result = failed ? 'Test scan failed' : label('settings.network.noWifiFound');
						assert(message() === result, 'Scan result missing before host update');
						for (const next of ['192.0.2.41', '192.0.2.42']) {
							await publish(next);
							assert(message() === result, `Host update replaced scan result: ${message()}`);
							assert(!!target.querySelector('.message.failed') === failed, 'Host update changed scan result severity');
							assert(address().value === (dirty ? '192.0.2.30' : next), 'Incorrect field reseed after scan');
							assert(save().classList.contains('disabled') === dirty, 'Incorrect stale Save state after scan');
							if (dirty) assert(target.textContent.includes(label('settings.network.reloadRequired')), 'Scan result hid stale Save explanation');
						}
						await edit(address(), '192.0.2.60');
						await publish('192.0.2.61');
						assert(message() === label('settings.network.changedOutside'), 'New edit retained protection of the previous scan result');
					});
				}
			}

			await test('a new successful scan clears the previous scan failure protection', async () => {
				scanFails = true;
				await click(label('settings.network.scan'));
				await publish('192.0.2.41');
				scanFails = false;
				await click(label('settings.network.scan'));
				assert(message() === '', 'Retry did not clear the previous failure');
				await publish('192.0.2.42');
				assert(message() === label('settings.network.reloadedFromHost'), 'Successful retry kept the old result protection');
			});

			for (const dirty of [false, true]) {
				await test(`failed join survives multiple host updates with ${dirty ? 'dirty' : 'clean'} IPv4 form`, async () => {
					if (dirty) await edit(address(), '192.0.2.30');
					await click(label('settings.network.scan'));
					await click('Test network');
					await edit(target.querySelector('input[type="password"]'), 'incorrect-test-password');
					joinFails = true;
					await click(label('settings.network.join'));
					const failure = message();
					assert(failure.includes('check the password') && target.querySelector('.message.failed'), `Join failure missing: ${failure}`);
					for (const next of ['192.0.2.41', '192.0.2.42']) {
						await publish(next);
						assert(message() === failure && target.querySelector('.message.failed'), 'Host update replaced the join failure');
						assert(address().value === (dirty ? '192.0.2.30' : next), 'Incorrect field reseed after join');
						assert(save().classList.contains('disabled') === dirty, 'Incorrect stale Save state');
						if (dirty) assert(target.textContent.includes(label('settings.network.reloadRequired')), 'Failed join hid stale Save explanation');
					}
					if (dirty) {
						await click(label('common.save'));
						assert(applyCalls === 0, 'Disabled Save reached the API');
						await click(label('settings.network.scan'));
						assert(message() === label('settings.network.changedOutside'), 'Scan left stale Save without an explanation');
					}
				});
			}

			for (const blockedBy of ['active', 'policy'])
				for (const device of ['keyboard', 'gamepad']) {
					await test(`${blockedBy === 'policy' ? 'policy-' : ''}disabled Wi-Fi row ignores ${device} confirm while an enabled row accepts it`, async () => {
						const policyReason = 'Test policy blocks this network';
						wifi = blockedBy === 'active' ? [{ ...testNetwork, ssid: 'Active network', active: true }, testNetwork] : [{ ...testNetwork, security: 'WPA2/AES', connectable: false, unavailableReason: policyReason }];
						await click(label('settings.network.scan'));
						const originalGamepads = Object.getOwnPropertyDescriptor(navigator, 'getGamepads');
						const pad = { axes: [0, 0], buttons: Array.from({ length: 17 }, () => ({ pressed: false })) };
						Object.defineProperty(navigator, 'getGamepads', { configurable: true, value: () => [pad] });
						const frames = async () => {
							for (let frame = 0; frame < 3; frame++) await new Promise(requestAnimationFrame);
							await settle();
						};
						const confirm = async () => {
							if (device === 'keyboard') {
								window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
								window.dispatchEvent(new KeyboardEvent('keyup', { key: 'Enter' }));
								await settle();
							} else {
								assert(document.hasFocus(), 'Gamepad test needs a focused browser tab');
								pad.buttons[0].pressed = true;
								await frames();
								pad.buttons[0].pressed = false;
								await frames();
							}
						};
						try {
							startInput();
							const active = button(blockedBy === 'active' ? 'Active network ✓' : 'Test network');
							for (let step = 0; step < 15 && !active.classList.contains('selected'); step++) {
								emit('down');
								await settle();
							}
							assert(active.classList.contains('selected') && active.classList.contains('disabled'), 'Disabled row not selected through navigation');
							await confirm();
							assert(!target.querySelector('input[type="password"]'), 'Disabled row requested a password');
							assert(joinCalls.length === 0, 'Disabled row submitted a Wi-Fi connection');
							if (blockedBy === 'policy') {
								assert(target.textContent.includes(policyReason), 'Policy reason was not displayed');
								wifi = [{ ...testNetwork, security: 'WPA2/AES', connectable: true }];
								await click(label('settings.network.scan'));
							} else emit('down');
							await settle();
							assert(button('Test network').classList.contains('selected'), 'Enabled row not selected through navigation');
							await confirm();
							assert(target.querySelector('input[type="password"]'), 'Enabled row did not accept confirm');
							if (blockedBy === 'policy') {
								await edit(target.querySelector('input[type="password"]'), 'test-network-password');
								await click(label('settings.network.join'));
								assert(joinCalls.length === 1 && joinCalls[0].ssid === testNetwork.ssid && joinCalls[0].password === 'test-network-password', 'Connectable control did not submit credentials');
							}
						} finally {
							stopInput();
							if (originalGamepads) Object.defineProperty(navigator, 'getGamepads', originalGamepads);
							else delete navigator.getGamepads;
						}
					});
				}

			await test('policy-disabled Wi-Fi row explains its state and ignores mouse click', async () => {
				wifi = [{ ...testNetwork, security: 'WPA2/AES', connectable: false, unavailableReason: 'Test policy blocks this network' }];
				await click(label('settings.network.scan'));
				await click('Test network');
				assert(!target.querySelector('input[type="password"]') && joinCalls.length === 0, 'Policy-disabled click opened or submitted the join');
				assert(target.textContent.includes('Test policy blocks this network'), 'Policy reason was not displayed');
			});

			await test('missing policy reason uses an unavailable notice instead of unsupported security', async () => {
				wifi = [{ ...testNetwork, security: 'WPA2/AES', connectable: false }];
				await click(label('settings.network.scan'));
				const status = target.querySelector('.network-status').textContent;
				assert(button('Test network').classList.contains('disabled'), 'Unavailable network remains enabled');
				assert(status && !status.startsWith('{') && status !== label('settings.network.unsupportedSecurity') && status !== label('settings.network.secured'), `Missing generic unavailable explanation: ${status}`);
			});

			await test('refreshed scan blocks a join form opened before policy changed', async () => {
				wifi = [{ ...testNetwork, security: 'WPA2/AES', connectable: true }];
				await click(label('settings.network.scan'));
				await click('Test network');
				await edit(target.querySelector('input[type="password"]'), 'test-network-password');
				wifi = [{ ...wifi[0], connectable: false, unavailableReason: 'Test policy blocks this network' }];
				await click(label('settings.network.scan'));
				await click(label('settings.network.join'));
				assert(joinCalls.length === 0, 'Stale join form submitted after policy blocked the network');
				assert(button(label('settings.network.join')).classList.contains('disabled'), 'Stale join submit remains enabled');
			});

			await test('security change after selection requires a new network selection', async () => {
				await click(label('settings.network.scan'));
				await click('Test network');
				await edit(target.querySelector('input[type="password"]'), 'test-network-password');
				wifi = [{ ...testNetwork, security: '', secured: false }];
				await click(label('settings.network.scan'));
				const submit = [...target.querySelectorAll('[role="button"]')].find(item => (item.getAttribute('aria-label') ?? item.textContent.trim()) === label('settings.network.join'));
				assert(!submit || submit.classList.contains('disabled'), 'Changed security leaves the previous join enabled');
				assert(target.textContent.includes(label('settings.network.selectionChanged')), 'Changed selection has no explanation');
				submit?.click();
				await settle();
				assert(joinCalls.length === 0, 'Previous selection joined the replacement open network');
				await click('Test network');
				assert(joinCalls.length === 1, 'Explicit open-network selection did not join');
				assert(joinCalls[0].password === '' && joinCalls[0].expectedSecurity === '', 'Explicit open join retained the previous credentials or security');
			});

			await test('join request preserves selected security when the network changes before submission', async () => {
				await click(label('settings.network.scan'));
				await click('Test network');
				await edit(target.querySelector('input[type="password"]'), 'test-network-password');
				wifi = [{ ...testNetwork, security: '', secured: false }];
				await click(label('settings.network.join'));
				assert(joinCalls.length === 1, 'Selected network was not submitted');
				assert(joinCalls[0].expectedSecurity === 'WPA2', 'Request adopted unseen security instead of the selected WPA2');
			});

			await test('changed raw SSID bytes invalidate a selection with the same display name', async () => {
				wifi = [{ ...testNetwork, ssid: '\uFFFD', ssidHex: 'FF' }];
				await click(label('settings.network.scan'));
				await click('\uFFFD');
				await edit(target.querySelector('input[type="password"]'), 'test-network-password');
				wifi = [{ ...wifi[0], ssidHex: 'FE' }];
				await click(label('settings.network.scan'));
				assert(button(label('settings.network.join')).classList.contains('disabled'), 'Replacement raw SSID retained the previous join');
				assert(target.textContent.includes(label('settings.network.selectionChanged')), 'Raw SSID replacement has no explanation');
				await click(label('settings.network.join'));
				assert(joinCalls.length === 0, 'Old selection submitted the replacement raw SSID');
			});

			await test('join request retains selected raw SSID bytes before an unseen scan change', async () => {
				wifi = [{ ...testNetwork, ssid: '\uFFFD', ssidHex: 'FF' }];
				await click(label('settings.network.scan'));
				await click('\uFFFD');
				await edit(target.querySelector('input[type="password"]'), 'test-network-password');
				wifi = [{ ...wifi[0], ssidHex: 'FE' }];
				await click(label('settings.network.join'));
				assert(joinCalls.length === 1, 'Selected raw SSID was not submitted');
				assert(joinCalls[0].expectedSsidHex === 'FF' && joinCalls[0].expectedSecurity === 'WPA2', 'Request lost the selected raw SSID or security');
			});

			await test('different raw SSIDs sharing a display name render as disabled ambiguous rows', async () => {
				wifi = ['FF', 'FE'].map(ssidHex => ({ ...testNetwork, ssid: '\uFFFD', ssidHex }));
				await click(label('settings.network.scan'));
				const rows = [...target.querySelectorAll('[role="button"]')].filter(item => (item.getAttribute('aria-label') ?? item.textContent.trim()) === '\uFFFD');
				assert(rows.length === 2, 'Distinct raw SSIDs failed to render as separate rows');
				for (const row of rows) {
					assert(row.classList.contains('disabled'), 'Ambiguous display name remains selectable');
					row.click();
				}
				await settle();
				assert(!target.querySelector('input[type="password"]') && joinCalls.length === 0, 'Ambiguous raw SSID opened or submitted a join');
				assert(target.textContent.includes(label('settings.network.ambiguousName')), 'Ambiguous raw SSIDs have no explanation');
			});

			await test('Wi-Fi status, authentication and signal are inside the network button', async () => {
				await click(label('settings.network.scan'));
				const row = button('Test network');
				assert(row.querySelector('.network-name')?.textContent === 'Test network', 'Network name is outside its button');
				assert(row.querySelector('.network-status')?.textContent.includes(label('settings.network.secured')), 'Security status is outside its button');
				assert(row.querySelector('.security')?.textContent.includes('WPA2'), 'Authentication method is outside its button');
				assert(row.querySelector('.signal')?.textContent.includes('80%'), 'Signal is outside its button');
				assert(row.getAttribute('aria-label') === 'Test network', 'Rich button lost its accessible name');
			});

			await test('inline password panel preserves keyboard order before the next network', async () => {
				wifi = [testNetwork, { ...testNetwork, ssid: 'Second network' }];
				await click(label('settings.network.scan'));
				const row = button('Test network');
				for (let step = 0; step < 15 && !row.classList.contains('selected'); step++) {
					emit('down');
					await settle();
				}
				assert(row.classList.contains('selected'), 'Network row could not be selected by keyboard');
				await click('Test network');
				assert(row.closest('.wifi-row').nextElementSibling?.classList.contains('join-panel'), 'Password panel is not beside its selected network');
				emit('down');
				await settle();
				assert(target.querySelector('input[type="password"]').closest('.input-field').classList.contains('selected'), 'Keyboard skipped the inline password');
				emit('down');
				await settle();
				assert(button(label('settings.network.join')).classList.contains('selected'), 'Keyboard skipped the inline Join action');
				emit('down');
				await settle();
				assert(button('Second network').classList.contains('selected'), 'Keyboard order collided with the following network');
			});

			for (const failed of [false, true]) {
				await test(`pending join is visible and blocks duplicate confirmation before ${failed ? 'failure' : 'success'}`, async () => {
					await click(label('settings.network.scan'));
					await click('Test network');
					await edit(target.querySelector('input[type="password"]'), 'test-network-password');
					waitForJoin = true;
					const submit = button(label('settings.network.join'));
					submit.click();
					await settle();
					try {
						assert(joinCalls.length === 1 && pendingJoin, 'Join request did not start');
						const status = target.querySelector('.join-panel .joining[role="status"]');
						assert(status?.textContent.includes('Test network') && status.textContent.includes(label('settings.network.joining')), 'Pending join has no visible network-specific status');
						assert(target.querySelector('input[type="password"]').disabled && submit.classList.contains('disabled'), 'Pending join controls remain editable');
						submit.click();
						window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
						window.dispatchEvent(new KeyboardEvent('keyup', { key: 'Enter' }));
						await settle();
						assert(joinCalls.length === 1, 'Repeated confirmation sent a second join request');
						if (failed) pendingJoin.reject(new Error('Deferred join failed'));
						else pendingJoin.resolve();
						await settle();
						assert(!target.querySelector('.joining'), 'Completed join still reports progress');
						assert(message() === (failed ? 'Deferred join failed' : get(t)('settings.network.joined', { ssid: 'Test network' })), 'Join result missing');
						assert(target.querySelector('.wifi-list .message'), 'Join result is detached from the selected network');
					} finally {
						pendingJoin?.resolve();
						await settle();
					}
				});

				await test(`current connection and pending disconnect survive ${failed ? 'failure' : 'success'}`, async () => {
					host.interfaces[0].wifi = { ssid: 'Connected network', signal: 74, radio: 'on' };
					networkState.set(structuredClone(host));
					await settle();
					const current = target.querySelector('.connection');
					assert(current.textContent.includes('Connected network') && current.textContent.includes('74%') && current.textContent.includes('192.0.2.10'), 'Current connection details require a scan');
					assert(!target.querySelector('.wifi-row'), 'Current connection test unexpectedly scanned');
					waitForDisconnect = true;
					const disconnect = button(label('settings.network.disconnect'));
					disconnect.click();
					await settle();
					try {
						assert(disconnectCalls === 1 && pendingDisconnect, 'Disconnect request did not start');
						assert(current.querySelector('.joining[role="status"]')?.textContent.includes(label('settings.network.disconnecting')), 'Disconnect progress is missing');
						assert(current.textContent.includes('Connected network'), 'UI claimed disconnection before the host replied');
						disconnect.click();
						await settle();
						assert(disconnectCalls === 1, 'Repeated click submitted a second disconnect');
						if (failed) pendingDisconnect.reject(new Error('Deferred disconnect failed'));
						else pendingDisconnect.resolve();
						await settle();
						assert(!current.querySelector('.joining'), 'Completed disconnect still reports progress');
						assert(current.textContent.includes(failed ? 'Connected network' : label('settings.network.notConnected')), 'Current connection disagrees with the host reply');
						assert(message() === (failed ? 'Deferred disconnect failed' : label('settings.network.disconnected')), 'Disconnect result is missing');
					} finally {
						pendingDisconnect?.resolve();
						await settle();
					}
				});
			}
		} catch (error) {
			results.push({ name: 'harness', passed: false, error: error.message });
			output.textContent += `\nFAIL harness: ${error.stack}`;
		} finally {
			if (component) await unmount(component);
			api.call = originalCall;
			networkSubscriptionActive.set(false);
			window.networkFormTestResults = results;
			document.documentElement.dataset.testStatus = results.length && results.every(result => result.passed) ? 'passed' : 'failed';
		}
	</script>
</html>
