name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
          # The 1.4.2 install below overwrites this binary before the post step would cache it.
          no-cache: true
      - name: Install package test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools xz-utils
      - name: Install
        run: |
          bun install --frozen-lockfile
          (cd backend && bun install --frozen-lockfile)
          (cd frontend && bun install --frozen-lockfile)
          (cd shared && bun install --frozen-lockfile)
          (cd cli && bun install --frozen-lockfile)
      - name: Formatting
        run: ./prettier-all.sh --check
      - name: Backend (typecheck, unit, e2e)
        run: ./test-be.sh
      - name: Frontend (svelte-check, unit)
        run: ./test-fe.sh
      - name: Frontend browser fixtures (headless Chrome)
        working-directory: frontend
        timeout-minutes: 10
        run: bun run test:fixtures
      - name: Shared and CLI typecheck
        run: |
          ./test-shared.sh
          ./test-cli.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Compile and run native file operations with the package builder's Bun
        working-directory: backend
        run: |
          test "$(bun --version)" = 1.4.2
          bun build --compile tests/helpers/dataset-native-smoke.ts --outfile "$RUNNER_TEMP/dataset-native-smoke-1.4"
          "$RUNNER_TEMP/dataset-native-smoke-1.4"

  # Native dataset checks, one job per operating system: a new architecture is one
  # more matrix entry rather than another job.
  windows-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
          # The 1.4.2 install below overwrites this binary before the post step would cache it.
          no-cache: true
      - name: Require the native architecture
        env:
          EXPECTED_NATIVE_ARCH: ${{ matrix.arch }}
        run: bun -e "if (process.platform !== 'win32' || process.arch !== process.env.EXPECTED_NATIVE_ARCH) throw new Error('A native Windows runner is required'); console.log(process.platform, process.arch, Bun.version)"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Native dataset regressions
        run: bun test tests/unit/lish/safe-dataset-files.test.ts tests/unit/lish/safe-dataset-files-windows.test.ts tests/unit/lish/dataset-transfer.test.ts tests/unit/lish/dataset-transfer-cleanup.test.ts tests/unit/lish/dataset-source-changes.test.ts tests/unit/lish/dataset-linked-move.test.ts tests/unit/lish/dataset-retained-path.test.ts
      - name: Compile and run native file operations
        run: |
          bun build --compile tests/helpers/dataset-native-smoke.ts --outfile "$RUNNER_TEMP/dataset-native-smoke.exe"
          "$RUNNER_TEMP/dataset-native-smoke.exe"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Compile and run native file operations with the package builder's Bun
        run: |
          test "$(bun --version)" = 1.4.2
          bun build --compile tests/helpers/dataset-native-smoke.ts --outfile "$RUNNER_TEMP/dataset-native-smoke-1.4.exe"
          "$RUNNER_TEMP/dataset-native-smoke-1.4.exe"

  macos-native:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
          # The 1.4.2 install below overwrites this binary before the post step would cache it.
          no-cache: true
      - name: Install
        run: bun install --frozen-lockfile
      - name: Native dataset regressions
        run: bun test tests/unit/lish/safe-dataset-files.test.ts tests/unit/lish/safe-dataset-files-posix.test.ts tests/unit/lish/dataset-transfer.test.ts tests/unit/lish/dataset-transfer-cleanup.test.ts tests/unit/lish/dataset-source-changes.test.ts tests/unit/lish/dataset-linked-move.test.ts tests/unit/lish/dataset-retained-path.test.ts
      - name: Compile and run native file operations
        run: |
          bun build --compile tests/helpers/dataset-native-smoke.ts --outfile "$RUNNER_TEMP/dataset-native-smoke"
          "$RUNNER_TEMP/dataset-native-smoke"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Compile and run native file operations with the package builder's Bun
        run: |
          test "$(bun --version)" = 1.4.2
          bun build --compile tests/helpers/dataset-native-smoke.ts --outfile "$RUNNER_TEMP/dataset-native-smoke-1.4"
          "$RUNNER_TEMP/dataset-native-smoke-1.4"

  macos-clock-native:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Require native macOS ARM64
        run: bun -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') throw new Error('Native macOS ARM64 is required'); console.log(process.platform, process.arch, Bun.version)"
      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Compare clock conversion with native mktime
        working-directory: backend
        run: |
          TZ=UTC bun test tests/unit/native-darwin-clock.test.ts tests/unit/native-darwin-clock-oracle.test.ts
          TZ=Pacific/Honolulu bun test tests/unit/native-darwin-clock.test.ts tests/unit/native-darwin-clock-oracle.test.ts
      - name: Preserve NTP file metadata on macOS
        working-directory: backend
        run: bun test tests/unit/native-darwin-time.test.ts
      - name: Verify the compiled macOS clock worker
        working-directory: backend
        run: |
          bun build --compile tests/helpers/native-worker-compiled.ts src/native/worker-runtime.ts --define 'LISH_NATIVE_WORKER_ENTRY="./src/native/worker-runtime.ts"' --outfile worker-smoke
          TZ=UTC ./worker-smoke
          TZ=Pacific/Honolulu ./worker-smoke
      - name: Install macOS package tools
        run: |
          brew install imagemagick librsvg
          cargo install tauri-cli --version 2.12.1 --locked
      - name: Build universal macOS packages
        run: sh app/build.sh --os macos --target universal --format dmg zip --compress min
      - name: Verify both macOS architectures
        run: |
          lipo backend/build/lish-backend -verify_arch x86_64 arm64
          lipo backend/build/lish-network-helper -verify_arch x86_64 arm64
          lipo app/build/universal-apple-darwin/release/bundle/macos/LiberShare.app/Contents/MacOS/LiberShare -verify_arch x86_64 arm64

  windows-arm64-native:
    runs-on: windows-11-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.4.0", "1.4.2"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v${{ matrix.bun }}/bun-windows-aarch64.zip
      - name: Require native Windows ARM64
        run: bun -e "if (process.platform !== 'win32' || process.arch !== 'arm64') throw new Error('Native Windows ARM64 is required'); console.log(process.platform, process.arch, Bun.version)"
      - name: Select native PowerShell oracle
        run: |
          "WINDOWS_ORACLE_PWSH=$((Get-Command pwsh.exe).Source)" >> $env:GITHUB_ENV
          [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          $PSVersionTable.PSVersion.ToString()
      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Exercise native Windows APIs
        working-directory: backend
        run: >-
          bun test tests/unit/native-library.test.ts
          tests/unit/native-win32-com.test.ts
          tests/unit/native-win32-wmi.test.ts
          tests/unit/native-win32-wmi-values.test.ts
          tests/unit/native-win32-network-reader.test.ts
          tests/unit/native-win32-authenticode.test.ts
          tests/unit/native-win32-time.test.ts
          tests/unit/native-process-identity.test.ts
      - name: Compile and run embedded native workers
        working-directory: backend
        shell: bash
        run: |
          bun build --compile tests/helpers/native-worker-compiled.ts src/native/worker-runtime.ts --define 'LISH_NATIVE_WORKER_ENTRY="./src/native/worker-runtime.ts"' --outfile worker-smoke.exe
          ./worker-smoke.exe
      - name: Verify DNS writes and rollback on an isolated loopback adapter
        working-directory: backend
        run: ./tests/helpers/windows-arm64-dns-smoke.ps1

  docker:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Compile the native Docker API smoke client
        env:
          EXPECTED_NATIVE_ARCH: ${{ matrix.arch }}
        run: |
          bun -e "if (process.platform !== 'linux' || process.arch !== process.env.EXPECTED_NATIVE_ARCH) throw new Error('A native Linux runner is required'); console.log(process.platform, process.arch)"
          bun build --compile backend/tests/helpers/docker-native-smoke.ts --outfile docker-native-smoke
      - name: Clean backend image build
        run: docker build --no-cache -f docker/Dockerfile -t lish-backend-ci .
      - name: Start the image and wait for its health check
        run: |
          docker network create --internal lish-backend-ci
          docker run -d --name lish-backend-ci --network lish-backend-ci --cap-drop ALL -v "$PWD/docker-native-smoke:/native-smoke:ro" -e LISH_TOKEN=ci-smoke-token -e BACKEND_PORT=1158 -e EXPECTED_NATIVE_ARCH=${{ matrix.arch }} lish-backend-ci
          for attempt in $(seq 1 30); do
            if docker exec lish-backend-ci /app/lish-backend --healthcheck; then exit 0; fi
            sleep 2
          done
          docker logs lish-backend-ci
          exit 1
      - name: Verify read-only network and time APIs in the actual image
        run: docker exec lish-backend-ci /native-smoke
      - name: Remove the container
        if: always()
        run: |
          docker rm -f lish-backend-ci || true
          docker network rm lish-backend-ci || true
